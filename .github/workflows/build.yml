name: Build Windows ZIP app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure the official Electron runtime is installed
        shell: pwsh
        timeout-minutes: 10
        run: |
          $runtimeReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Installing the official Electron runtime (attempt $attempt of 3)."
            try {
              & node node_modules/electron/install.js
              if ($LASTEXITCODE -eq 0) {
                $runtimeReady = $true
                break
              }
            } catch {
              Write-Warning $_.Exception.Message
            }
            if ($attempt -lt 3) {
              Write-Warning 'Electron download failed; retrying the same official download.'
              Start-Sleep -Seconds (20 * $attempt)
            }
          }
          if (-not $runtimeReady) {
            throw 'The official Electron runtime could not be installed after 3 attempts.'
          }

      - name: Run unit and content checks
        run: npm test

      - name: Build Windows x64 ZIP distribution
        run: npm run build

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath 'dist' -Filter '*.zip' -File | Sort-Object Name)
          if ($artifacts.Count -eq 0) { throw 'No Windows ZIP distribution was produced.' }
          $checksums = foreach ($artifact in $artifacts) {
            $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($artifact.Name)"
          }
          $checksums | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding utf8

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: P4G-Companion-windows-x64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

# Public releases use the exact ZIP distribution checked on the target Windows PC.
# CI builds remain downloadable review artifacts; they do not replace release assets.
