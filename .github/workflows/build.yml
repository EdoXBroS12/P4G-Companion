name: Build portable Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure the official Electron runtime is installed
        run: node node_modules/electron/install.js

      - name: Run unit and content checks
        run: npm test

      - name: Build portable Windows x64 executable
        run: npm run build -- --publish never

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath 'dist' -Filter '*.exe' -File)
          if ($artifacts.Count -eq 0) { throw 'No portable executable was produced.' }
          $checksums = foreach ($artifact in $artifacts) {
            $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($artifact.Name)"
          }
          $checksums | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding utf8

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: P4G-Companion-windows-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: windows
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the verified Windows build
        uses: actions/download-artifact@v7
        with:
          name: P4G-Companion-windows-x64-${{ github.sha }}
          path: release-artifact

      - name: Publish the tagged Windows startup fix
        shell: bash
        working-directory: release-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f P4G_Companion.exe
          test -f SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat > "$RUNNER_TEMP/p4g-release-notes.md" <<'NOTES'
          Windows startup packaging fix for P4G Companion 1.2.0.

          The bundled upstream Electron runtime is preserved byte-for-byte. Electron fuses and Windows security settings are unchanged. Native and portable startup were verified on the tested Windows system with Smart App Control enabled.

          Download P4G_Companion.exe and use SHA256SUMS.txt to verify it. The app remains unsigned; acceptance can vary between Windows systems.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            P4G_Companion.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'P4G Companion 1.2.0 — Windows startup fix' \
            --notes-file "$RUNNER_TEMP/p4g-release-notes.md" \
            --latest
